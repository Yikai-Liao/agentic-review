overviewAgent: production-semantics
reviewAgents:
  - id: production-semantics
    required: true
    instructions: |
      本仓库是中央 PR Review Engine。重点检查候选 Engine 与可信控制面、Reviewer 与 Publisher、目标仓库数据与凭证之间的边界，以及 required Check 是否可能 false-green。
  - id: test-quality
    required: true
    instructions: |
      重点检查 schema、diff 定位、App Check、Webhook 去重及失败关闭测试是否真正约束生产契约，而不是仅复述当前实现。
