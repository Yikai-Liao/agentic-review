name: Agentic Review

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/name
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_number:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # 同一 PR 保留当前运行；新快照排队，后续快照自动替换尚未开始的旧队列项。
  group: agentic-review-${{ inputs.repository_id }}-${{ inputs.pull_number }}
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      owner: ${{ steps.target.outputs.owner }}
      name: ${{ steps.target.outputs.name }}
      pi_outcome: ${{ steps.pi-review.outcome }}
    steps:
      - name: Validate dispatch inputs
        id: target
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          IFS=/ read -r owner name extra <<< "$REPOSITORY"
          [[ "$owner" =~ ^[A-Za-z0-9-]+$ && "$name" =~ ^[A-Za-z0-9._-]+$ && -z "$extra" ]]
          [[ "$REPOSITORY_ID" =~ ^[0-9]+$ && "$PULL_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "owner=$owner"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Mint read-only target token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read

      - name: Mint review token
        id: review-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          # 仅供 action 内置的 create_pull_request_review。
          permission-pull-requests: write

      - name: Validate current pull request
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          gh api "repos/$REPOSITORY/pulls/$PULL_NUMBER" | jq -e \
            --argjson repository_id "$REPOSITORY_ID" \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and .base.repo.id == $repository_id and .base.sha == $base and .head.sha == $head'

      # 两个版本分别放在明确目录，Agent 通过环境变量读取，不依赖工作区根目录。
      - name: Checkout target pull request
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: review-target
          fetch-depth: 0
          persist-credentials: false

      # base 单独放在 review-base，优先提供完整本地上下文，减少 Agent 额外获取代码的操作。
      - name: Checkout base commit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.base_sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: review-base
          fetch-depth: 1
          persist-credentials: false

      # Checkout after the target: checkout cleans its own root, so the
      # trusted control checkout cannot be removed as an untracked directory.
      - name: Checkout control-plane rules
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Find last reviewed head
        id: review-checkpoint
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_APP_SLUG: ${{ steps.read-token.outputs.app-slug }}
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
        run: node control/scripts/find-review-checkpoint.mjs

      - name: Prepare review diffs
        id: review-diffs
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          CHECKPOINT_HEAD: ${{ steps.review-checkpoint.outputs.head_sha }}
          REVIEW_DIFF_PATH: ${{ runner.temp }}/review.diff
          REVIEW_FOCUS_DIFF_PATH: ${{ runner.temp }}/review-focus.diff
        run: |
          git -C review-target diff --no-ext-diff --no-textconv \
            --find-renames --find-copies --unified=20 \
            "$BASE_SHA...$HEAD_SHA" > "$REVIEW_DIFF_PATH"

          if [[ -n "$CHECKPOINT_HEAD" ]]; then
            git -C review-target diff --no-ext-diff --no-textconv \
              --find-renames --find-copies --unified=20 \
              "$CHECKPOINT_HEAD" "$HEAD_SHA" > "$REVIEW_FOCUS_DIFF_PATH.tmp"
          fi
          node control/scripts/finalize-review-focus.mjs

      - name: Load review prompt
        id: prompt
        shell: bash
        run: |
          {
            echo 'prompt<<REVIEW_PROMPT'
            cat control/prompts/review-rules.md
            echo REVIEW_PROMPT
          } >> "$GITHUB_OUTPUT"

      # Pi 不会自动认识组织内的自定义模型；按 orchestra-backend 的可用配置注册它。
      - name: Configure Pi model
        env:
          REVIEW_AGENT_MODEL: ${{ vars.REVIEW_AGENT_MODEL }}
        run: |
          mkdir -p "$HOME/.pi/agent"
          jq -n --arg model "$REVIEW_AGENT_MODEL" '{
            providers: {
              openai: {
                models: [{
                  id: $model,
                  name: $model,
                  api: "openai-responses",
                  reasoning: true,
                  input: ["text", "image"],
                  contextWindow: 272000,
                  maxTokens: 128000,
                  thinkingLevelMap: {
                    off: "none",
                    minimal: null,
                    low: "low",
                    medium: "medium",
                    high: "high",
                    xhigh: "xhigh",
                    max: "max"
                  },
                  compat: { supportsStrictMode: true }
                }]
              }
            }
          }' > "$HOME/.pi/agent/models.json"

      - name: Run Pi review
        id: pi-review
        uses: shaftoe/pi-coding-agent-action@v2.27.0
        env:
          # Agent shell 使用只读 installation token；gh 会自动读取 GH_TOKEN。
          # 该 token 不能评论、修改仓库、合并 PR 或修改 workflow。
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          # 让 action 和 gh 知道当前审查的目标仓库；不改变 token 权限。
          GITHUB_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          # 优先读取预先 checkout 的本地代码；按需补充只读代码上下文。
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          REVIEW_BASE_PATH: ${{ github.workspace }}/review-base
          REVIEW_DIFF_PATH: ${{ runner.temp }}/review.diff
          REVIEW_FOCUS_DIFF_PATH: ${{ runner.temp }}/review-focus.diff
          REVIEW_MODE: ${{ steps.review-diffs.outputs.mode }}
          REVIEW_CHECKPOINT_HEAD: ${{ steps.review-diffs.outputs.checkpoint_head }}
          # 自定义 thread 工具只向该文件追加无凭证请求；文件内容始终按不可信输入处理。
          REVIEW_THREAD_UPDATES_PATH: ${{ runner.temp }}/review-thread-updates.ndjson
        with:
          # shaftoe action 内置的 create_pull_request_review 需要该 write token。
          # GitHub Action input 仍属于 shaftoe 进程环境；彻底隔离需上游把 Agent 放入清理环境的子进程。
          # 本次只保证自定义 reply_to_review_thread 不读取 INPUT_GITHUB_TOKEN，而是写待发布请求。
          github_token: ${{ steps.review-token.outputs.token }}
          # 模型服务商和模型名称；均来自中央仓库配置。
          provider: openai
          model: ${{ vars.REVIEW_AGENT_MODEL }}
          # OpenAI-compatible Azure gateway；不配置时模型会被发送到错误的默认端点。
          base_url: ${{ vars.REVIEW_AGENT_BASE_URL }}
          # 模型 API 凭证；不与 GitHub installation token 混用。
          token: ${{ secrets.REVIEW_AGENT_API_KEY }}
          # 控制 Agent 的推理强度，不改变可用工具或 GitHub 权限。
          thinking_level: high
          # 让 action 获取并审查这个 PR，而不是默认上下文。
          pr_number: ${{ inputs.pull_number }}
          # 覆盖常规大型 PR；超大 diff 仍需 Agent 按相关文件和路径审查，避免上下文失控。
          diff_max_lines: 10000
          diff_max_bytes: 1000000
          # 中央扩展只校验并排队已有 inline thread 的状态变化，不直接调用 GitHub 写 API。
          extensions: control/.github/pi-extensions/review-tools.ts
          # Agent 可用工具：前七项对 GitHub 只读；后两项分别发布新 finding、排队历史状态更新。
          loaded_tools: |
            read
            grep
            find
            ls
            bash
            get_ci_status
            get_workflow_run_logs
            create_pull_request_review
            reply_to_review_thread
          # 从中央 checkout 加载单一 Prompt；不要在 workflow 中重复规则。
          prompt: ${{ steps.prompt.outputs.prompt }}

      # 只把无凭证队列传给新的 runner；队列始终按不可信输入处理。
      - name: Prepare thread update artifact
        if: steps.pi-review.outcome == 'success'
        env:
          REVIEW_THREAD_UPDATES_PATH: ${{ runner.temp }}/review-thread-updates.ndjson
          ARTIFACT_PATH: ${{ runner.temp }}/thread-update-artifact/review-thread-updates.ndjson
        run: |
          mkdir -p "$(dirname "$ARTIFACT_PATH")"
          if [[ -f "$REVIEW_THREAD_UPDATES_PATH" ]]; then
            cp "$REVIEW_THREAD_UPDATES_PATH" "$ARTIFACT_PATH"
          else
            : > "$ARTIFACT_PATH"
          fi

      - name: Upload thread update artifact
        if: steps.pi-review.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: review-thread-updates-${{ github.run_id }}
          path: ${{ runner.temp }}/thread-update-artifact/review-thread-updates.ndjson
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: review
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint trusted publication token
        id: review-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ needs.review.outputs.owner }}
          repositories: ${{ needs.review.outputs.name }}
          permission-contents: read
          permission-pull-requests: write
          permission-checks: write

      # 先确认完成 Check 所需的凭证可用，再创建 Check，避免 token mint 失败留下 in_progress 状态。
      - name: Start Agentic Review check
        id: review-check
        uses: actions/github-script@v9
        env:
          REPOSITORY: ${{ inputs.repository }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_TASK_ID: ${{ inputs.repository_id }}:${{ inputs.pull_number }}:${{ inputs.base_sha }}:${{ inputs.head_sha }}
          REVIEW_RUN_ID: ${{ github.run_id }}
        with:
          github-token: ${{ steps.review-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const response = await github.rest.checks.create({
              owner,
              repo,
              name: 'Agentic Review / audit',
              head_sha: process.env.HEAD_SHA,
              external_id: `${process.env.REVIEW_TASK_ID}:${process.env.REVIEW_RUN_ID}`,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: `${process.env.GITHUB_SERVER_URL}/${process.env.REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              output: {
                title: 'Agentic Review 正在审查',
                summary: '中央 Review Agent 已完成分析，正在发布可信结果。',
              },
            });
            core.setOutput('check_id', String(response.data.id));

      - name: Checkout trusted publisher
        if: needs.review.outputs.pi_outcome == 'success'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download thread update artifact
        if: needs.review.outputs.pi_outcome == 'success'
        uses: actions/download-artifact@v4
        with:
          name: review-thread-updates-${{ github.run_id }}
          path: ${{ runner.temp }}/thread-update-artifact

      # 新 runner 中才注入 write token；发布器校验 schema、当前 SHA、root comment 和 bot 身份。
      - name: Publish review thread updates
        id: publish-thread-updates
        if: needs.review.outputs.pi_outcome == 'success'
        env:
          GH_TOKEN: ${{ steps.review-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_BOT_LOGIN: ${{ steps.review-token.outputs.app-slug }}[bot]
          REVIEW_THREAD_UPDATES_PATH: ${{ runner.temp }}/thread-update-artifact/review-thread-updates.ndjson
        run: node scripts/publish-thread-updates.mjs

      - name: Complete Agentic Review check
        if: always()
        uses: actions/github-script@v9
        env:
          REPOSITORY: ${{ inputs.repository }}
          CHECK_ID: ${{ steps.review-check.outputs.check_id }}
          PI_REVIEW_OUTCOME: ${{ needs.review.outputs.pi_outcome }}
          THREAD_UPDATES_OUTCOME: ${{ steps.publish-thread-updates.outcome }}
        with:
          github-token: ${{ steps.review-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const conclusion = process.env.PI_REVIEW_OUTCOME === 'cancelled'
              ? 'neutral'
              : process.env.PI_REVIEW_OUTCOME === 'success' && process.env.THREAD_UPDATES_OUTCOME === 'success'
                ? 'success'
                : 'failure';
            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: conclusion === 'success'
                  ? 'Agentic Review 已完成'
                  : conclusion === 'neutral'
                    ? 'Agentic Review 已取消'
                    : 'Agentic Review 执行失败',
                summary: conclusion === 'success'
                  ? '审查已完成。'
                  : conclusion === 'neutral'
                    ? '该审查已取消，结果不再代表当前 PR 快照。'
                    : '审查未能可靠完成，当前提交保持不可合并。',
              },
            });
