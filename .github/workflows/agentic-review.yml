name: Agentic Review

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/name
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_number:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agentic-review-${{ inputs.repository }}-${{ inputs.pull_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate dispatch inputs
        id: target
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        shell: bash
        run: |
          IFS=/ read -r owner name extra <<< "$REPOSITORY"
          [[ "$owner" =~ ^[A-Za-z0-9-]+$ && "$name" =~ ^[A-Za-z0-9._-]+$ && -z "$extra" ]]
          [[ "$REPOSITORY_ID" =~ ^[0-9]+$ && "$PULL_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          {
            echo "owner=$owner"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      - name: Mint read-only target token
        id: read-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read

      - name: Mint review token
        id: review-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-contents: read
          permission-pull-requests: write

      - name: Validate current pull request
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          gh api "repos/$REPOSITORY/pulls/$PULL_NUMBER" | jq -e \
            --argjson repository_id "$REPOSITORY_ID" \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and .base.repo.id == $repository_id and .base.sha == $base and .head.sha == $head'

      # 两个版本分别放在明确目录，Agent 通过环境变量读取，不依赖工作区根目录。
      - name: Checkout target pull request
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: review-target
          fetch-depth: 0
          persist-credentials: false

      # base 单独放在 review-base，优先提供完整本地上下文，减少 Agent 额外获取代码的操作。
      - name: Checkout base commit
        uses: actions/checkout@v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.base_sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: review-base
          fetch-depth: 1
          persist-credentials: false

      # Checkout after the target: checkout cleans its own root, so the
      # trusted control checkout cannot be removed as an untracked directory.
      - name: Checkout control-plane rules
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Load review prompt
        id: prompt
        shell: bash
        run: |
          {
            echo 'prompt<<REVIEW_PROMPT'
            cat control/prompts/review-rules.md
            echo REVIEW_PROMPT
          } >> "$GITHUB_OUTPUT"

      - name: Run Pi review
        uses: shaftoe/pi-coding-agent-action@v2.9.1
        env:
          # Agent shell 使用只读 installation token；gh 会自动读取 GH_TOKEN。
          # 该 token 不能评论、修改仓库、合并 PR 或修改 workflow。
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          # 让 action 和 gh 知道当前审查的目标仓库；不改变 token 权限。
          GITHUB_REPOSITORY: ${{ inputs.repository }}
          # Agent 只读取预先 checkout 的本地代码，不自行 clone 仓库。
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          REVIEW_BASE_PATH: ${{ github.workspace }}/review-base
        with:
          # 仅供 action 内部的 create_pull_request_review 使用；不注入 Agent shell。
          github_token: ${{ steps.review-token.outputs.token }}
          # 模型服务商和模型名称；均来自中央仓库配置。
          provider: ${{ vars.REVIEW_AGENT_PROVIDER }}
          model: ${{ vars.REVIEW_AGENT_MODEL }}
          # 模型 API 凭证；不与 GitHub installation token 混用。
          token: ${{ secrets.REVIEW_AGENT_API_KEY }}
          # 控制 Agent 的推理强度，不改变可用工具或 GitHub 权限。
          thinking_level: high
          # 让 action 获取并审查这个 PR，而不是默认上下文。
          pr_number: ${{ inputs.pull_number }}
          # 覆盖常规大型 PR；超大 diff 仍需 Agent 按相关文件和路径审查，避免上下文失控。
          diff_max_lines: 10000
          diff_max_bytes: 1000000
          # Agent 可用工具：前九项只读；最后一项是唯一的 Review 发布出口。
          loaded_tools: |
            read
            grep
            find
            ls
            bash
            get_pr_diff
            get_issue_or_pr_thread
            get_ci_status
            get_workflow_run_logs
            create_pull_request_review
          # 从中央 checkout 加载单一 Prompt；不要在 workflow 中重复规则。
          prompt: ${{ steps.prompt.outputs.prompt }}
