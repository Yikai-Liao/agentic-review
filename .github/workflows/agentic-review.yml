name: Agentic Review

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/name
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_number:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      head_sha:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: agentic-review-${{ inputs.repository }}-${{ inputs.pull_number }}-${{ inputs.head_sha }}
  cancel-in-progress: true

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      owner: ${{ steps.target.outputs.owner }}
      name: ${{ steps.target.outputs.name }}
      check_id: ${{ steps.check.outputs.check_id }}
      duplicate: ${{ steps.check.outputs.duplicate }}
      engine_ref: ${{ steps.snapshot.outputs.engine_ref }}
    steps:
      - name: Validate target
        id: target
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          IFS=/ read -r owner name extra <<< "$REPOSITORY"
          if [[ ! "$owner" =~ ^[A-Za-z0-9-]+$ || ! "$name" =~ ^[A-Za-z0-9._-]+$ || -n "$extra" ]]; then
            echo "Unsupported repository: $REPOSITORY"
            exit 1
          fi
          if [[ ! "$REPOSITORY_ID" =~ ^[0-9]+$ || ! "$PULL_NUMBER" =~ ^[0-9]+$ || ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ || ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Invalid PR snapshot inputs"
            exit 1
          fi
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Mint target repository token
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-checks: write
          permission-pull-requests: read

      - name: Validate PR snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ steps.target-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          CONTROL_REPOSITORY: ${{ github.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          pr="$(gh api "repos/$REPOSITORY/pulls/$PULL_NUMBER")"
          jq -e \
            --argjson repository_id "$REPOSITORY_ID" \
            --arg base "$BASE_SHA" \
            --arg head "$HEAD_SHA" \
            '.state == "open" and .draft == false and .base.repo.id == $repository_id and .base.sha == $base and .head.sha == $head' \
            <<< "$pr" >/dev/null
          engine_ref=""
          if [[ "${REPOSITORY,,}" == "${CONTROL_REPOSITORY,,}" ]]; then
            engine_ref="$(jq -r '.merge_commit_sha // empty' <<< "$pr")"
            [[ -n "$engine_ref" ]]
          fi
          echo "engine_ref=$engine_ref" >> "$GITHUB_OUTPUT"

      - name: Checkout trusted control plane
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start required Check
        id: check
        env:
          GITHUB_TOKEN: ${{ steps.target-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ inputs.repository }}
          REVIEW_HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_TASK_ID: ${{ inputs.repository_id }}:${{ inputs.pull_number }}:${{ inputs.base_sha }}:${{ inputs.head_sha }}
          REVIEW_APP_SLUG: ${{ steps.target-token.outputs.app-slug }}
        run: pnpm tsx scripts/github-check.ts start

  review:
    needs: start
    if: needs.start.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Mint read-only target token
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ needs.start.outputs.owner }}
          repositories: ${{ needs.start.outputs.name }}
          permission-contents: read

      - name: Checkout trusted Engine
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: engine
          persist-credentials: false

      - name: Checkout target PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.target-token.outputs.token }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - name: Checkout candidate Engine
        if: needs.start.outputs.engine_ref != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.start.outputs.engine_ref }}
          token: ${{ steps.target-token.outputs.token }}
          path: candidate
          persist-credentials: false

      - name: Verify candidate merge parents
        if: needs.start.outputs.engine_ref != ''
        working-directory: candidate
        env:
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          read -r _ first second extra <<< "$(git rev-list --parents -n 1 HEAD)"
          [[ "$first" == "$BASE_SHA" && "$second" == "$HEAD_SHA" && -z "$extra" ]]

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: engine/pnpm-lock.yaml

      - name: Install trusted Engine
        working-directory: engine
        run: pnpm install --frozen-lockfile

      - name: Install candidate Engine
        if: needs.start.outputs.engine_ref != ''
        working-directory: candidate
        run: pnpm install --frozen-lockfile

      - name: Prepare bounded output directory
        run: |
          mkdir -p "${{ runner.temp }}/review-output"
          touch "${{ runner.temp }}/review-output/empty"

      - name: Run Review Engine
        working-directory: ${{ needs.start.outputs.engine_ref != '' && 'candidate' || 'engine' }}
        env:
          REVIEW_REPOSITORY_PATH: ${{ github.workspace }}/target
          REVIEW_BASE_SHA: ${{ inputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/review-output/review.json
          REVIEW_AGENT_MODEL: ${{ vars.REVIEW_AGENT_MODEL }}
          REVIEW_AGENT_BASE_URL: ${{ vars.REVIEW_AGENT_BASE_URL }}
          REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}
        run: pnpm start

      - name: Upload bounded Review request
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-output
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload Reviewer metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-metrics-${{ inputs.repository_id }}-${{ inputs.pull_number }}-${{ inputs.head_sha }}
          path: target/.review/results
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: [start, review]
    if: always() && needs.start.result == 'success' && needs.start.outputs.duplicate != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint publisher token
        id: target-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ needs.start.outputs.owner }}
          repositories: ${{ needs.start.outputs.name }}
          permission-checks: write
          permission-contents: read
          permission-pull-requests: write

      - name: Checkout trusted Publisher
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false

      - name: Checkout target PR head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ inputs.head_sha }}
          token: ${{ steps.target-token.outputs.token }}
          fetch-depth: 0
          path: target
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.4.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: control/pnpm-lock.yaml

      - name: Install trusted Publisher
        working-directory: control
        run: pnpm install --frozen-lockfile

      - name: Download staged Review
        if: needs.review.result == 'success'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: review-request-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-output

      - name: Publish validated Review
        id: publish
        if: needs.review.result == 'success'
        continue-on-error: true
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ steps.target-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ inputs.repository }}
          REVIEW_REPOSITORY_PATH: ${{ github.workspace }}/target
          REVIEW_BASE_SHA: ${{ inputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ inputs.head_sha }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          REVIEW_OUTPUT_PATH: ${{ runner.temp }}/review-output/review.json
        run: pnpm tsx scripts/publish-review.ts

      - name: Complete required Check
        if: always()
        working-directory: control
        env:
          GITHUB_TOKEN: ${{ steps.target-token.outputs.token }}
          GITHUB_REPOSITORY: ${{ inputs.repository }}
          REVIEW_CHECK_ID: ${{ needs.start.outputs.check_id }}
          REVIEW_CONCLUSION: ${{ needs.review.result == 'success' && steps.publish.outcome == 'success' && 'success' || 'failure' }}
        run: pnpm tsx scripts/github-check.ts complete

      - name: Fail closed
        if: always() && (needs.review.result != 'success' || steps.publish.outcome != 'success')
        run: exit 1
