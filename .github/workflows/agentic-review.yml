name: Agentic Review

on:
  workflow_dispatch:
    inputs:
      repository:
        description: owner/name
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_number:
        required: true
        type: string
      base_sha:
        required: false
        type: string
      head_sha:
        required: false
        type: string
      trigger_source:
        required: false
        default: automatic
        type: string
      comment_id:
        required: false
        type: string
      comment_body:
        required: false
        type: string
      comment_root_id:
        required: false
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  # 自动请求只保留一个最新候选；显式请求各自保留，交给执行层串行处理。
  group: agentic-review-admission-${{ inputs.repository_id }}-${{ inputs.pull_number }}-${{ inputs.trigger_source == 'automatic' && 'automatic' || github.run_id }}
  cancel-in-progress: false

jobs:
  review:
    uses: ./.github/workflows/review-execution.yml
    secrets: inherit
    with:
      repository: ${{ inputs.repository }}
      repository_id: ${{ inputs.repository_id }}
      pull_number: ${{ inputs.pull_number }}
      base_sha: ${{ inputs.base_sha }}
      head_sha: ${{ inputs.head_sha }}
      trigger_source: ${{ inputs.trigger_source }}
      comment_id: ${{ inputs.comment_id }}
      comment_body: ${{ inputs.comment_body }}
      comment_root_id: ${{ inputs.comment_root_id }}
