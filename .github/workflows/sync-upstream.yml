name: Sync Public Upstream

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-public-upstream
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.repository == 'Qiyin-Tech/agentic-review' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout internal repository
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0
          ssh-key: ${{ secrets.UPSTREAM_SYNC_SSH_KEY }}

      # Git 原生拒绝非快进更新；组织侧分叉或上游改写历史时明确失败。
      - name: Fast-forward main from public upstream
        run: |
          git fetch --no-tags https://github.com/Yikai-Liao/agentic-review.git refs/heads/main
          git push origin FETCH_HEAD:refs/heads/main
