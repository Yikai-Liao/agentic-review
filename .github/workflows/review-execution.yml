name: Agentic Review Execution

on:
  workflow_call:
    inputs:
      repository:
        description: owner/name
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_number:
        required: true
        type: string
      base_sha:
        required: false
        type: string
      head_sha:
        required: false
        type: string
      trigger_source:
        required: false
        default: automatic
        type: string
      comment_id:
        required: false
        type: string
      comment_body:
        required: false
        type: string
      comment_root_id:
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  REVIEW_LANGUAGE: ${{ vars.REVIEW_LANGUAGE }}
  # Agent 调用与发布 footer 共用推理档位，避免运行元数据错报。
  REVIEW_THINKING_LEVEL: ${{ vars.REVIEW_THINKING_LEVEL }}
  REVIEW_FAST_MODE: ${{ vars.REVIEW_FAST_MODE }}
  PI_FOLD_VERSION: 4.3.0
  # 保留操作手册使用的官方归档版本与校验值；当前 Review 不准备飞书工具。
  LARK_CLI_VERSION: 1.0.88
  LARK_CLI_SHA256_LINUX_AMD64: 497de20939acdd2aae4c898fea7a0ca71d5a459ed543202e762a8bcb3228effe

concurrency:
  # 同一 PR 的自动事件与 @ 请求共享队列；审查与发布全部结束后才释放并发槽。
  group: agentic-review-${{ inputs.repository_id }}-${{ inputs.pull_number }}
  queue: max
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Validate dispatch inputs
        id: target
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        shell: bash
        run: |
          : "${REVIEW_THINKING_LEVEL:?Set the REVIEW_THINKING_LEVEL repository variable}"
          case "${REVIEW_LANGUAGE:-}" in
            zh-CN|en) ;;
            *) echo 'REVIEW_LANGUAGE must be zh-CN or en' >&2; exit 1 ;;
          esac
          case "${REVIEW_FAST_MODE:-false}" in
            true|false) ;;
            *) echo 'REVIEW_FAST_MODE must be true or false' >&2; exit 1 ;;
          esac
          IFS=/ read -r owner name extra <<< "$REPOSITORY"
          [[ "$owner" =~ ^[A-Za-z0-9-]+$ && "$name" =~ ^[A-Za-z0-9._-]+$ && -z "$extra" ]]
          [[ "$REPOSITORY_ID" =~ ^[0-9]+$ && "$PULL_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$TRIGGER_SOURCE" == automatic || ( -z "$BASE_SHA" && -z "$HEAD_SHA" ) || ( "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ) ]]
          {
            echo "owner=$owner"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      # Agent 的 token 覆盖该 owner 中安装了 Review App 的仓库，供按下游规则查询关联代码、PR 和 Issue；权限始终只读。
      - name: Mint cross-repository read-only token
        id: read-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read

      - name: Checkout control-plane rules
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          # 维护用 Skill 和评测材料不进入 Agent 的控制面工作树或 Skill 发现范围。
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/pi-extensions/
            /central/
            /scripts/
            /skills/agentic-review/
            /package.json
            /pnpm-lock.yaml

      - name: Resolve current pull request snapshot
        id: snapshot
        uses: actions/github-script@v9.0.0
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          REVIEW_SNAPSHOT_PATH: ${{ runner.temp }}/review-snapshot.json
        with:
          github-token: ${{ steps.read-token.outputs.token }}
          script: |
            // github-script v9 自带 Node 24；后续可信脚本复用该运行时。
            core.addPath(require('node:path').dirname(process.execPath));
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/control/scripts/resolve-review-snapshot.ts`);
            await main();

      - name: Mint check token
        id: check-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-checks: write

      # workflow_dispatch 不会自动挂到目标 PR；Agent 启动前显式创建关联 Check。
      - name: Start Agentic Review check
        id: review-check
        uses: actions/github-script@v9.0.0
        env:
          REPOSITORY: ${{ inputs.repository }}
          HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          CHECK_NAME: ${{ inputs.trigger_source == 'automatic' && 'Agentic Review / audit' || 'Agentic Review / requested' }}
          REVIEW_TASK_ID: ${{ inputs.repository_id }}:${{ inputs.pull_number }}:${{ steps.snapshot.outputs.base_sha }}:${{ steps.snapshot.outputs.head_sha }}:${{ inputs.trigger_source }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ steps.check-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const { parseReviewLanguage, reviewCheckMessages } = await import(`${process.env.GITHUB_WORKSPACE}/control/scripts/review-language.ts`);
            // Agent 启动前固定本轮文案；完成步骤只读取可信步骤输出。
            const messages = reviewCheckMessages(parseReviewLanguage(process.env.REVIEW_LANGUAGE));
            core.setOutput('messages', JSON.stringify(messages));
            const response = await github.rest.checks.create({
              owner,
              repo,
              name: process.env.CHECK_NAME,
              head_sha: process.env.HEAD_SHA,
              external_id: `${process.env.REVIEW_TASK_ID}:${process.env.REVIEW_RUN_ID}:${process.env.REVIEW_RUN_ATTEMPT}`,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              output: {
                title: messages.in_progress[0],
                summary: messages.in_progress[1],
              },
            });
            core.setOutput('check_id', String(response.data.id));

      - name: Restore trusted tokenizer dependencies
        id: tokenizer-dependencies
        uses: actions/cache/restore@v6.1.0
        with:
          path: control/node_modules
          key: review-tokenizer-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('control/package.json', 'control/pnpm-lock.yaml') }}

      - name: Install trusted tokenizer dependencies
        if: steps.tokenizer-dependencies.outputs.cache-hit != 'true'
        # Corepack 按当前目录选择 packageManager；pnpm 的 --dir 参数对它不生效。
        working-directory: control
        run: corepack pnpm install --prod --frozen-lockfile --ignore-scripts

      # 缓存只由可信准备阶段保存；Agent 运行后不再把可变目录写回缓存。
      - name: Save trusted tokenizer dependencies
        if: steps.tokenizer-dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: control/node_modules
          key: ${{ steps.tokenizer-dependencies.outputs.cache-primary-key }}

      - name: Prepare review context
        id: review-context
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          CONTROL_TOKEN: ${{ github.token }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_REPOSITORY_ID: ${{ inputs.repository_id }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          REVIEW_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          REVIEW_COMMENT_ID: ${{ inputs.comment_id }}
          REVIEW_COMMENT_ROOT_ID: ${{ inputs.comment_root_id }}
          REVIEW_COMMENT_BODY: ${{ inputs.comment_body }}
          REVIEW_SNAPSHOT_PATH: ${{ runner.temp }}/review-snapshot.json
          REVIEW_APP_SLUG: ${{ steps.read-token.outputs.app-slug }}
        run: node control/scripts/prepare-review-context.ts

      - name: Ensure ripgrep is available
        run: |
          if ! command -v rg >/dev/null 2>&1; then
            # 安装进度不进入运行日志；apt 错误仍输出到 stderr 并使步骤失败。
            sudo apt-get update -qq
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends ripgrep >/dev/null
          fi
          rg --version | head -n 1

      - name: Restore trusted Pi fold extension
        id: pi-fold
        uses: actions/cache/restore@v6.1.0
        with:
          path: ${{ runner.temp }}/review-pi-extensions
          key: review-pi-extensions-node24-${{ runner.os }}-${{ runner.arch }}-pi-fold-${{ env.PI_FOLD_VERSION }}

      - name: Install trusted Pi fold extension
        if: steps.pi-fold.outputs.cache-hit != 'true'
        # 发布包没有运行时依赖；Pi host 由第三方 Action 提供，不再安装 peer SDK。
        run: >-
          npm install --prefix "$RUNNER_TEMP/review-pi-extensions"
          --ignore-scripts --no-audit --no-fund --no-package-lock --legacy-peer-deps
          "pi-fold@$PI_FOLD_VERSION"

      # 与 tokenizer 缓存一样，在 Agent 启动前保存，运行中产生的状态不写回缓存。
      - name: Save trusted Pi fold extension
        if: steps.pi-fold.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ runner.temp }}/review-pi-extensions
          key: ${{ steps.pi-fold.outputs.cache-primary-key }}

      # 中央规则由可信 control checkout 预载；模型覆盖保留 Pi 目录中的公开单价。
      - name: Configure Pi runtime
        env:
          REVIEW_AGENT_MODEL: ${{ vars.REVIEW_AGENT_MODEL }}
          REVIEW_EXPLICIT_PROMPT_CACHE: ${{ vars.REVIEW_EXPLICIT_PROMPT_CACHE }}
          REVIEW_AGENT_BASE_URL: ${{ vars.REVIEW_AGENT_BASE_URL }}
          REVIEW_AGENT_API_KEY: ${{ secrets.REVIEW_AGENT_API_KEY }}
          REVIEW_WORKSPACE_PATH: ${{ github.workspace }}/review-workspace
        run: |
          mkdir -p "$HOME/.pi/agent" "$REVIEW_WORKSPACE_PATH"
          chmod 700 "$REVIEW_WORKSPACE_PATH"
          # 使用 Pi 原生重试，仅将初始等待调为 15 秒，后续为 30、60 秒。
          cat > "$HOME/.pi/agent/settings.json" <<'JSON'
          {
            "retry": { "baseDelayMs": 15000 },
            "compaction": { "enabled": true }
          }
          JSON
          jq -n --arg model "$REVIEW_AGENT_MODEL" \
            --argjson explicit_cache "${REVIEW_EXPLICIT_PROMPT_CACHE:-false}" '
            if ($explicit_cache | type) != "boolean" then
              error("REVIEW_EXPLICIT_PROMPT_CACHE must be true or false")
            else {
              providers: {
                openai: {
                  modelOverrides: { ($model): {
                    reasoning: true,
                    input: ["text", "image"],
                    contextWindow: 272000,
                    # 输入与输出共用 272k 窗口，单次输出上限保持 25k。
                    maxTokens: 25000,
                    thinkingLevelMap: {
                      off: "none",
                      minimal: null,
                      low: "low",
                      medium: "medium",
                      high: "high",
                      xhigh: "xhigh",
                      max: "max"
                    },
                    compat: { supportsStrictMode: true, supportsExplicitPromptCacheMode: $explicit_cache }
                  }}
                }
              }
            } end' > "$HOME/.pi/agent/models.json"
          PI_MODELS_PATH="$HOME/.pi/agent/models.json" node control/scripts/configure-review-fast-mode.ts

      - name: Run Pi review
        id: pi-review
        # Agent 预算由 review-tools 扩展执行；步骤超时只兜住单个卡死的工具调用。
        timeout-minutes: 15
        uses: shaftoe/pi-coding-agent-action@v2.30.1
        env:
          # Agent shell 使用只读 installation token；gh 会自动读取 GH_TOKEN。
          # 该 token 不能评论、修改仓库、合并 PR 或修改 workflow。
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          # 供 Agent 的只读 gh 命令定位目标仓库；不能覆盖保留的 GITHUB_REPOSITORY。
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          REVIEW_BASE_SHA: ${{ steps.snapshot.outputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          REVIEW_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          REVIEW_COMMENT_ID: ${{ inputs.comment_id }}
          REVIEW_COMMENT_BODY: ${{ inputs.comment_body }}
          REVIEW_COMMENT_ROOT_ID: ${{ inputs.comment_root_id }}
          REVIEW_APP_SLUG: ${{ steps.read-token.outputs.app-slug }}
          # compaction 后从控制面恢复规则与中央输出协议。
          REVIEW_CONTROL_PATH: ${{ github.workspace }}/control
          # 优先读取预先 checkout 的本地代码；按需补充只读代码上下文。
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          REVIEW_BASE_PATH: ${{ github.workspace }}/review-base
          REVIEW_ASSOCIATIONS_PATH: ${{ runner.temp }}/review-associations.json
          REVIEW_INPUT_PATH: ${{ runner.temp }}/review-input.json
          # diff 由 Agent 在固定 SHA 区间内按路径读取，不生成聚合 diff 文件。
          REVIEW_CHECKPOINT_HEAD: ${{ steps.review-context.outputs.checkpoint_head }}
          REVIEW_CONTEXT_PATH: ${{ runner.temp }}/review-context/review-context.json
          REVIEW_PROGRESS_PATH: ${{ github.workspace }}/review-workspace/review-progress.json
          REVIEW_INVENTORY_DIGEST: ${{ steps.review-context.outputs.inventory_digest }}
          # 9 分钟调查预算：最后 3 分钟收尾，到期后只允许提交已审部分。
          REVIEW_TIME_BUDGET_SECONDS: 540
          # 上一轮工作稿独立挂载为只读参考，不作为本轮工作稿继续修改。
          REVIEW_PREVIOUS_WORKSPACE_PATH: ${{ steps.review-context.outputs.previous_workspace }}
          REVIEW_PREVIOUS_REQUEST_WORKSPACE_PATH: ${{ steps.review-context.outputs.previous_request_workspace }}
          # Agent 只在隔离工作区写草稿；自定义工具接收结果对象，自动保存工作稿副本并封存到固定结果路径。
          REVIEW_WORKSPACE_PATH: ${{ github.workspace }}/review-workspace
          REVIEW_RESULT_PATH: ${{ runner.temp }}/review-result.json
        with:
          # Agent 和 action 都只持有目标仓库的只读 installation token。
          github_token: ${{ steps.read-token.outputs.token }}
          # 模型服务商和模型名称；均来自中央仓库配置。
          provider: openai
          model: ${{ vars.REVIEW_AGENT_MODEL }}
          # OpenAI-compatible Azure gateway；不配置时模型会被发送到错误的默认端点。
          base_url: ${{ vars.REVIEW_AGENT_BASE_URL }}
          # 模型 API 凭证；不与 GitHub installation token 混用。
          token: ${{ secrets.REVIEW_AGENT_API_KEY }}
          # 控制 Agent 的推理强度，不改变可用工具或 GitHub 权限。
          thinking_level: ${{ env.REVIEW_THINKING_LEVEL }}
          # pi-fold 在窗口达到 80% 时把旧上下文折叠成确定性摘要，不调用模型；
          # 原生自动压缩保留在下层，只在折叠后仍溢出时兜底。调查证据由工作稿持久化。
          auto_compaction: true
          # Action 仅在开启导出时使用落盘会话；原始 JSONL 也可保留导出前的失败记录。
          export_session_jsonl: true
          # 允许用 JavaScript 编排现有工具，并在返回模型前筛选查询结果。
          enable_codemode: true
          # 不注册依赖中央仓库 context 的 shaftoe GitHub 工具。
          load_builtin_extensions: false
          # 外部扩展在可信准备阶段安装并缓存，Action 只加载本地入口。
          # pi-fold 的 pi_fold_context 工具不进入 loaded_tools，折叠全部自动进行，模型不调度上下文。
          extensions: |
            ${{ runner.temp }}/review-pi-extensions/node_modules/pi-fold/extensions/index.js
            control/.github/pi-extensions/review-cost.ts
            control/.github/pi-extensions/review-runtime.ts
            control/.github/pi-extensions/review-input.ts
            control/.github/pi-extensions/review-tools.ts
          # write/edit 仅用于 Review 工作区；GitHub 查询工具和 installation token 均只读。
          loaded_tools: |
            read
            write
            edit
            grep
            find
            ls
            bash
            set_review_scope
            submit_review
            codemode
          # 入口预载固定可信规则；compaction 后按入口从控制面恢复。
          prompt: ${{ steps.review-context.outputs.prompt }}

      # Agent 已结束；写令牌只交给后续可信发布步骤，不注入 Agent。
      - name: Mint trusted publication token
        id: publication-token
        if: ${{ always() && steps.review-check.outputs.check_id != '' }}
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          # GitHub GraphQL 的 resolveReviewThread/unresolveReviewThread 实际要求 contents: write。
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write

      # 可信发布入口负责验证、组装、发布和保存报告；组装成功后即记录可恢复状态。
      - name: Publish review
        id: publish-review
        if: ${{ !cancelled() && steps.review-context.outputs.context_digest != '' }}
        uses: actions/github-script@v9.0.0
        env:
          REVIEW_PUBLISHER_ARCHIVE: ${{ steps.review-context.outputs.publisher_archive }}
          GH_TOKEN: ${{ steps.publication-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          REVIEW_REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ steps.snapshot.outputs.base_sha }}
          HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          REVIEW_INVENTORY_DIGEST: ${{ steps.review-context.outputs.inventory_digest }}
          REVIEW_COMPARISON_START: ${{ steps.review-context.outputs.comparison_start }}
          # 总评页脚标出上次完整审查的提交，读者据此判断本轮看了哪段变化。
          REVIEW_CHECKPOINT_HEAD: ${{ steps.review-context.outputs.checkpoint_head }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
          REVIEW_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          REVIEW_COMMENT_ID: ${{ inputs.comment_id }}
          REVIEW_COMMENT_BODY: ${{ inputs.comment_body }}
          REVIEW_COMMENT_ROOT_ID: ${{ inputs.comment_root_id }}
          REVIEW_CONTEXT_PATH: ${{ runner.temp }}/review-context/review-context.json
          REVIEW_CONTEXT_DIGEST: ${{ steps.review-context.outputs.context_digest }}
          REVIEW_PROGRESS_PATH: ${{ github.workspace }}/review-workspace/review-progress.json
          REVIEW_COVERAGE_PATH: ${{ github.workspace }}/review-workspace/review-coverage.json
          PI_REVIEW_OUTCOME: ${{ steps.pi-review.outcome }}
          REVIEW_BOT_LOGIN: ${{ steps.publication-token.outputs.app-slug }}[bot]
          REVIEW_RESULT_PATH: ${{ runner.temp }}/review-result.json
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_WORKSPACE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}#artifacts
          REVIEW_MODEL: openai/${{ vars.REVIEW_AGENT_MODEL }}
          REVIEW_DURATION_SECONDS: ${{ steps.pi-review.outputs.duration_seconds }}
          REVIEW_INPUT_TOKENS: ${{ steps.pi-review.outputs.input_tokens }}
          REVIEW_OUTPUT_TOKENS: ${{ steps.pi-review.outputs.output_tokens }}
          REVIEW_COST: ${{ steps.pi-review.outputs.cost }}
        with:
          # 启动器只用默认只读 token；签发发布 token 失败时也要先保存可恢复范围。
          github-token: ${{ github.token }}
          script: |
            // 只执行准备步骤输出中的固定控制面代码，不读取 Agent 可改写的本地脚本。
            const fs = require('node:fs'), path = require('node:path');
            const directory = fs.mkdtempSync(path.join(process.env.RUNNER_TEMP, 'review-publisher-'));
            require('node:child_process').execFileSync('tar', ['-xzf', '-', '-C', directory], {
              input: Buffer.from(process.env.REVIEW_PUBLISHER_ARCHIVE, 'base64'),
            });
            const { main } = await import(require('node:url').pathToFileURL(path.join(directory, 'scripts/publish-review-run.ts')).href);
            await main();

      - name: Archive Pi session
        id: review-session
        if: ${{ always() && steps.pi-review.outcome != 'skipped' && steps.pi-review.outcome != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-session-${{ inputs.repository_id }}-${{ inputs.pull_number }}-${{ inputs.trigger_source }}-${{ github.run_id }}-${{ github.run_attempt }}
          # 原始会话包含折叠与原生 compaction 记录；pi-fold-evidence 保存被截断工具结果的原文，
          # 供重建折叠前的调查过程。归档不包含 auth.json 或运行时配置。
          path: |
            ~/.pi/agent/sessions/**/*.jsonl
            ~/.pi/agent/sessions/**/pi-fold-evidence/**
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

      # 每轮只归档一次：发布成功保存完成工作区，失败或取消仍保存可恢复范围及发布报告。
      - name: Archive review workspace
        id: review-workspace
        if: ${{ always() && steps.publish-review.outputs.workspace_ready == 'true' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: ${{ steps.publish-review.outcome == 'success' && 'review-completed-workspace' || 'review-workspace' }}-${{ inputs.repository_id }}-${{ inputs.pull_number }}-${{ inputs.trigger_source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/review-workspace
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      # 草稿组装或归档失败时保留原始诊断稿；它不进入下一轮范围恢复。
      - name: Upload unarchived review draft
        id: diagnostic-workspace
        if: ${{ always() && steps.review-workspace.outcome != 'success' && hashFiles('review-workspace/**') != '' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-draft-workspace-${{ inputs.repository_id }}-${{ inputs.pull_number }}-${{ inputs.trigger_source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/review-workspace
          if-no-files-found: error
          retention-days: 7

      - name: Complete Agentic Review check
        id: complete-check
        if: ${{ always() && steps.review-check.outputs.check_id != '' }}
        uses: actions/github-script@v9.0.0
        env:
          REPOSITORY: ${{ inputs.repository }}
          CHECK_ID: ${{ steps.review-check.outputs.check_id }}
          PI_REVIEW_OUTCOME: ${{ steps.pi-review.outcome }}
          PUBLISH_REVIEW_OUTCOME: ${{ steps.publish-review.outcome }}
          COMPLETION_WORKSPACE_OUTCOME: ${{ steps.review-workspace.outcome }}
          COVERAGE_PENDING: ${{ steps.publish-review.outputs.coverage_pending }}
          COVERAGE_TOTAL: ${{ steps.publish-review.outputs.coverage_total }}
          # 运行、用量与发布结果的长期记录；发布器未运行到输出时为空。
          CHECK_TEXT: ${{ steps.publish-review.outputs.check_text }}
          REVIEW_CHECK_MESSAGES: ${{ steps.review-check.outputs.messages }}
          REVIEW_JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ steps.publication-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split('/');
            // 发布成功必然写出覆盖统计；缺失时不能当作已全部覆盖。
            const pending = process.env.COVERAGE_PENDING === '' ? NaN : Number(process.env.COVERAGE_PENDING);
            const total = Number(process.env.COVERAGE_TOTAL);
            const delivered = process.env.REVIEW_JOB_STATUS === 'success' && process.env.PI_REVIEW_OUTCOME === 'success' && process.env.PUBLISH_REVIEW_OUTCOME === 'success' && process.env.COMPLETION_WORKSPACE_OUTCOME === 'success';
            // 部分覆盖已如实发布，但未审文件不能放行合并：action_required 与 failure 一样阻止 required check。
            const conclusion = process.env.PI_REVIEW_OUTCOME === 'cancelled' || process.env.REVIEW_JOB_STATUS === 'cancelled'
              ? 'cancelled'
              : !delivered || !(pending >= 0) ? 'failure' : pending > 0 ? 'action_required' : 'success';
            const outputs = JSON.parse(process.env.REVIEW_CHECK_MESSAGES);
            const [title, template] = outputs[conclusion];
            const summary = template.replaceAll('{reviewed}', String(total - pending))
              .replaceAll('{total}', String(total)).replaceAll('{pending}', String(pending));
            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: { title, summary, ...(process.env.CHECK_TEXT ? { text: process.env.CHECK_TEXT } : {}) },
            });
