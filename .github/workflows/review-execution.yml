name: Agentic Review Execution

on:
  workflow_call:
    inputs:
      repository:
        description: owner/name
        required: true
        type: string
      repository_id:
        required: true
        type: string
      pull_number:
        required: true
        type: string
      base_sha:
        required: false
        type: string
      head_sha:
        required: false
        type: string
      trigger_source:
        required: false
        default: automatic
        type: string
      comment_id:
        required: false
        type: string
      comment_body:
        required: false
        type: string
      comment_root_id:
        required: false
        type: string

permissions:
  actions: read
  contents: read

env:
  # Agent 调用与发布 footer 共用推理档位，避免运行元数据错报。
  REVIEW_THINKING_LEVEL: ${{ vars.REVIEW_THINKING_LEVEL }}
  # 保留操作手册使用的官方归档版本与校验值；当前 Review 不准备飞书工具。
  LARK_CLI_VERSION: 1.0.88
  LARK_CLI_SHA256_LINUX_AMD64: 497de20939acdd2aae4c898fea7a0ca71d5a459ed543202e762a8bcb3228effe
  # uses 与发布 footer 共用完整引用；footer 的 Action 版本由该引用派生。
  REVIEW_PI_ACTION_REF: &pi-action shaftoe/pi-coding-agent-action@v2.30.0

concurrency:
  # 同一 PR 的自动事件与 @ 请求共享队列；发布 job 完成后才释放并发槽。
  group: agentic-review-${{ inputs.repository_id }}-${{ inputs.pull_number }}
  queue: max
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    outputs:
      owner: ${{ steps.target.outputs.owner }}
      name: ${{ steps.target.outputs.name }}
      base_sha: ${{ steps.snapshot.outputs.base_sha }}
      head_sha: ${{ steps.snapshot.outputs.head_sha }}
      check_id: ${{ steps.review-check.outputs.check_id }}
      pi_outcome: ${{ steps.pi-review.outcome }}
      duration_seconds: ${{ steps.pi-review.outputs.duration_seconds }}
      input_tokens: ${{ steps.pi-review.outputs.input_tokens }}
      output_tokens: ${{ steps.pi-review.outputs.output_tokens }}
      cost: ${{ steps.pi-review.outputs.cost }}
      workspace_url: ${{ steps.review-workspace.outputs.artifact-url }}
      workspace_artifact_id: ${{ steps.review-workspace.outputs.artifact-id }}
      context_artifact_id: ${{ steps.review-context.outputs.artifact-id }}
      result_artifact_id: ${{ steps.review-result.outputs.artifact-id }}
      run_attempt: ${{ github.run_attempt }}
      inventory_digest: ${{ steps.request-scope.outputs.inventory_digest }}
      comparison_start: ${{ steps.request-scope.outputs.comparison_start }}
    steps:
      - name: Validate dispatch inputs
        id: target
        env:
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        shell: bash
        run: |
          : "${REVIEW_THINKING_LEVEL:?Set the REVIEW_THINKING_LEVEL repository variable}"
          IFS=/ read -r owner name extra <<< "$REPOSITORY"
          [[ "$owner" =~ ^[A-Za-z0-9-]+$ && "$name" =~ ^[A-Za-z0-9._-]+$ && -z "$extra" ]]
          [[ "$REPOSITORY_ID" =~ ^[0-9]+$ && "$PULL_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$TRIGGER_SOURCE" == automatic || ( -z "$BASE_SHA" && -z "$HEAD_SHA" ) || ( "$BASE_SHA" =~ ^[0-9a-f]{40}$ && "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ) ]]
          {
            echo "owner=$owner"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

      # Agent 的 token 覆盖该 owner 中安装了 Review App 的仓库，供按下游规则查询关联代码、PR 和 Issue；权限始终只读。
      - name: Mint cross-repository read-only token
        id: read-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          permission-contents: read
          permission-issues: read
          permission-pull-requests: read
          permission-actions: read
          permission-checks: read

      - name: Checkout control-plane rules
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: control
          persist-credentials: false
          # 维护用 Skill 和评测材料不进入 Agent 的控制面工作树或 Skill 发现范围。
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.github/pi-extensions/
            /central/
            /scripts/
            /skills/agentic-review/

      - name: Set up Node.js for trusted review scripts
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      - name: Resolve current pull request snapshot
        id: snapshot
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ inputs.base_sha }}
          HEAD_SHA: ${{ inputs.head_sha }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        run: node control/scripts/resolve-review-snapshot.ts

      - name: Mint check token
        id: check-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          permission-checks: write

      # workflow_dispatch 不会自动挂到目标 PR；Agent 启动前显式创建关联 Check。
      - name: Start Agentic Review check
        id: review-check
        uses: actions/github-script@v9.0.0
        env:
          REPOSITORY: ${{ inputs.repository }}
          HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          CHECK_NAME: ${{ inputs.trigger_source == 'automatic' && 'Agentic Review / audit' || 'Agentic Review / requested' }}
          REVIEW_TASK_ID: ${{ inputs.repository_id }}:${{ inputs.pull_number }}:${{ steps.snapshot.outputs.base_sha }}:${{ steps.snapshot.outputs.head_sha }}:${{ inputs.trigger_source }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_RUN_ATTEMPT: ${{ github.run_attempt }}
        with:
          github-token: ${{ steps.check-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const response = await github.rest.checks.create({
              owner,
              repo,
              name: process.env.CHECK_NAME,
              head_sha: process.env.HEAD_SHA,
              external_id: `${process.env.REVIEW_TASK_ID}:${process.env.REVIEW_RUN_ID}:${process.env.REVIEW_RUN_ATTEMPT}`,
              status: 'in_progress',
              started_at: new Date().toISOString(),
              details_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              output: {
                title: 'Agentic Review 正在审查',
                summary: '中央 Review Agent 已开始处理当前 PR。',
              },
            });
            core.setOutput('check_id', String(response.data.id));

      # 两个版本分别放在明确目录，Agent 通过环境变量读取，不依赖工作区根目录。
      - name: Checkout target pull request
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ steps.snapshot.outputs.head_sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: review-target
          fetch-depth: 0
          persist-credentials: false

      # base 单独放在 review-base，优先提供完整本地上下文，减少 Agent 额外获取代码的操作。
      - name: Checkout base commit
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ inputs.repository }}
          ref: ${{ steps.snapshot.outputs.base_sha }}
          token: ${{ steps.read-token.outputs.token }}
          path: review-base
          fetch-depth: 1
          persist-credentials: false

      - name: Validate queued comment snapshot
        if: inputs.trigger_source != 'automatic'
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          COMMENT_ID: ${{ inputs.comment_id }}
          COMMENT_BODY: ${{ inputs.comment_body }}
          COMMENT_ROOT_ID: ${{ inputs.comment_root_id }}
          TRIGGER_SOURCE: ${{ inputs.trigger_source }}
        run: node control/scripts/validate-review-trigger.ts

      - name: Prepare review association index
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          REVIEW_BASE_SHA: ${{ steps.snapshot.outputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          REVIEW_ASSOCIATIONS_PATH: ${{ runner.temp }}/review-associations.json
        run: node control/scripts/list-review-associations.ts

      - name: Find last reviewed head
        id: review-checkpoint
        uses: actions/github-script@v9.0.0
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ steps.snapshot.outputs.base_sha }}
          HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          REVIEW_APP_SLUG: ${{ steps.read-token.outputs.app-slug }}
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          CONTROL_REPOSITORY: ${{ github.repository }}
          CONTROL_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.read-token.outputs.token }}
          script: |
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/control/scripts/find-review-checkpoint.ts`);
            await main();

      - name: Find last requested PR scope
        id: previous-request
        if: inputs.trigger_source == 'pr_comment'
        uses: actions/github-script@v9.0.0
        env:
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REPOSITORY: ${{ inputs.repository }}
          REPOSITORY_ID: ${{ inputs.repository_id }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ steps.snapshot.outputs.base_sha }}
          HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          REVIEW_APP_SLUG: ${{ steps.read-token.outputs.app-slug }}
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          CONTROL_REPOSITORY: ${{ github.repository }}
          CONTROL_TOKEN: ${{ github.token }}
        with:
          github-token: ${{ steps.read-token.outputs.token }}
          script: |
            const { main } = await import(`${process.env.GITHUB_WORKSPACE}/control/scripts/find-review-request.ts`);
            await main();

      - name: Download previous requested workspace
        id: previous-request-download
        if: steps.previous-request.outputs.artifact_id != ''
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ steps.previous-request.outputs.artifact_id }}
          path: ${{ runner.temp }}/previous-request-workspace
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.previous-request.outputs.run_id }}

      - name: Activate previous requested workspace
        id: previous-request-workspace
        if: steps.previous-request-download.outcome == 'success'
        env:
          PREVIOUS_WORKSPACE_PATH: ${{ runner.temp }}/previous-request-workspace
        run: |
          chmod -R a-w "$PREVIOUS_WORKSPACE_PATH"
          echo "path=$PREVIOUS_WORKSPACE_PATH" >> "$GITHUB_OUTPUT"

      # 完整基线只接入可信发布器写出的完成工作区。
      - name: Download previous review workspace
        id: previous-workspace-download
        if: steps.review-checkpoint.outputs.workspace_artifact_id != ''
        continue-on-error: true
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ steps.review-checkpoint.outputs.workspace_artifact_id }}
          path: ${{ runner.temp }}/previous-review-workspace
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.review-checkpoint.outputs.run_id }}

      - name: Activate previous review workspace
        id: previous-review-workspace
        if: steps.previous-workspace-download.outcome == 'success'
        env:
          PREVIOUS_WORKSPACE_PATH: ${{ runner.temp }}/previous-review-workspace
          CHECKPOINT_HEAD: ${{ steps.review-checkpoint.outputs.head_sha }}
          CHECKPOINT_BASE: ${{ steps.snapshot.outputs.base_sha }}
          CHECKPOINT_RUN: ${{ steps.review-checkpoint.outputs.run_id }}
          CHECKPOINT_ATTEMPT: ${{ steps.review-checkpoint.outputs.run_attempt }}
          REPOSITORY: ${{ inputs.repository }}
          PULL_NUMBER: ${{ inputs.pull_number }}
        run: |
          node control/scripts/review-coverage.ts
          chmod -R a-w "$PREVIOUS_WORKSPACE_PATH"
          {
            echo "path=$PREVIOUS_WORKSPACE_PATH"
            echo "checkpoint_head=$CHECKPOINT_HEAD"
          } >> "$GITHUB_OUTPUT"

      - name: Persist requested review scope
        id: request-scope
        env:
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          REVIEW_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          REVIEW_COMMENT_ID: ${{ inputs.comment_id }}
          REVIEW_COMMENT_ROOT_ID: ${{ inputs.comment_root_id }}
          REVIEW_COMMENT_BODY: ${{ inputs.comment_body }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          REVIEW_BASE_SHA: ${{ steps.snapshot.outputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          REVIEW_CONTEXT_PATH: ${{ runner.temp }}/review-context/review-context.json
          REVIEW_PROGRESS_PATH: ${{ github.workspace }}/review-workspace/review-progress.json
          REVIEW_PREVIOUS_REQUEST_WORKSPACE_PATH: ${{ steps.previous-request-workspace.outputs.path }}
          REVIEW_PREVIOUS_RUN_ID: ${{ steps.previous-request.outputs.run_id }}
          REVIEW_PREVIOUS_RUN_ATTEMPT: ${{ steps.previous-request.outputs.run_attempt }}
          REVIEW_PREVIOUS_SOURCE: ${{ steps.previous-request.outputs.source }}
          REVIEW_PREVIOUS_PUBLISHED: ${{ steps.previous-request.outputs.published }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: node control/scripts/review-request.ts

      # 在 Agent 启动前封存请求；发布 job 按此 artifact ID 独立下载，不信任工作区中的副本。
      - name: Seal review context
        id: review-context
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-context-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-context
          if-no-files-found: error
          retention-days: 7

      - name: Prepare review input
        env:
          REVIEW_CONTEXT_PATH: ${{ runner.temp }}/review-context/review-context.json
          REVIEW_WORKSPACE_PATH: ${{ github.workspace }}/review-workspace
          REVIEW_PREVIOUS_REQUEST_WORKSPACE_PATH: ${{ steps.previous-request-workspace.outputs.path }}
          REVIEW_PREVIOUS_WORKSPACE_PATH: ${{ steps.previous-review-workspace.outputs.path }}
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          REVIEW_BASE_PATH: ${{ github.workspace }}/review-base
          REVIEW_INPUT_PATH: ${{ runner.temp }}/review-input.md
          REVIEW_ASSOCIATIONS_PATH: ${{ runner.temp }}/review-associations.json
        run: |
          node control/scripts/prepare-review-input.ts

      # Pi 不会自动认识组织内的自定义模型和中央运行时 skill；只从可信 control checkout 安装。
      - name: Configure Pi runtime
        env:
          REVIEW_AGENT_MODEL: ${{ vars.REVIEW_AGENT_MODEL }}
          REVIEW_WORKSPACE_PATH: ${{ github.workspace }}/review-workspace
        run: |
          mkdir -p "$HOME/.pi/agent/skills" "$REVIEW_WORKSPACE_PATH"
          chmod 700 "$REVIEW_WORKSPACE_PATH"
          cp -R control/skills/agentic-review "$HOME/.pi/agent/skills/"
          # shaftoe action 不提供 retry input；Pi SDK 的 retry 默认值在不同
          # 版本间可能变化，因此在受信运行时显式配置。容量错误只保留
          # provider 层这一份 retry budget；禁用 Agent 层重放，避免每次
          # provider retry exhaustion 又重新执行一轮 provider retries。
          cat > "$HOME/.pi/agent/settings.json" <<'JSON'
          {
            "retry": {
              "enabled": false,
              "provider": {
                "maxRetries": 3,
                "maxRetryDelayMs": 120000
              }
            }
          }
          JSON
          jq -n --arg model "$REVIEW_AGENT_MODEL" '{
            providers: {
              openai: {
                models: [{
                  id: $model,
                  name: $model,
                  api: "openai-responses",
                  reasoning: true,
                  input: ["text", "image"],
                  contextWindow: 500000,
                  maxTokens: 128000,
                  thinkingLevelMap: {
                    off: "none",
                    minimal: null,
                    low: "low",
                    medium: "medium",
                    high: "high",
                    xhigh: "xhigh",
                    max: "max"
                  },
                  compat: { supportsStrictMode: true }
                }]
              }
            }
          }' > "$HOME/.pi/agent/models.json"

      - name: Load review prompt
        id: review-prompt
        run: |
          {
            echo 'prompt<<REVIEW_PROMPT_EOF'
            cat control/central/review-rules.md
            for file in \
              control/skills/agentic-review/SKILL.md \
              control/skills/agentic-review/references/{protocol,findings,review-state,evidence-access}.md \
              control/central/{github-context,review-result}.md; do
              printf '\n\n## %s\n\n' "$file"
              cat "$file"
            done
            echo 'REVIEW_PROMPT_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Run Pi review
        id: pi-review
        timeout-minutes: 60
        uses: *pi-action
        env:
          # Agent shell 使用只读 installation token；gh 会自动读取 GH_TOKEN。
          # 该 token 不能评论、修改仓库、合并 PR 或修改 workflow。
          GH_TOKEN: ${{ steps.read-token.outputs.token }}
          # 供 Agent 的只读 gh 命令定位目标仓库；不能覆盖保留的 GITHUB_REPOSITORY。
          REVIEW_REPOSITORY: ${{ inputs.repository }}
          REVIEW_PULL_NUMBER: ${{ inputs.pull_number }}
          REVIEW_BASE_SHA: ${{ steps.snapshot.outputs.base_sha }}
          REVIEW_HEAD_SHA: ${{ steps.snapshot.outputs.head_sha }}
          REVIEW_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          REVIEW_COMMENT_ID: ${{ inputs.comment_id }}
          REVIEW_COMMENT_BODY: ${{ inputs.comment_body }}
          REVIEW_COMMENT_ROOT_ID: ${{ inputs.comment_root_id }}
          # compaction 后从控制面恢复规则与中央输出协议。
          REVIEW_CONTROL_PATH: ${{ github.workspace }}/control
          # 优先读取预先 checkout 的本地代码；按需补充只读代码上下文。
          REVIEW_TARGET_PATH: ${{ github.workspace }}/review-target
          REVIEW_BASE_PATH: ${{ github.workspace }}/review-base
          REVIEW_ASSOCIATIONS_PATH: ${{ runner.temp }}/review-associations.json
          REVIEW_INPUT_PATH: ${{ runner.temp }}/review-input.md
          # diff 由 Agent 在固定 SHA 区间内按路径读取，不生成聚合 diff 文件。
          REVIEW_CHECKPOINT_HEAD: ${{ steps.previous-review-workspace.outputs.checkpoint_head }}
          REVIEW_CONTEXT_PATH: ${{ runner.temp }}/review-context/review-context.json
          REVIEW_PROGRESS_PATH: ${{ github.workspace }}/review-workspace/review-progress.json
          REVIEW_INVENTORY_DIGEST: ${{ steps.request-scope.outputs.inventory_digest }}
          # 上一轮工作稿独立挂载为只读参考，不作为本轮工作稿继续修改。
          REVIEW_PREVIOUS_WORKSPACE_PATH: ${{ steps.previous-review-workspace.outputs.path }}
          REVIEW_PREVIOUS_REQUEST_WORKSPACE_PATH: ${{ steps.previous-request-workspace.outputs.path }}
          # Agent 只在隔离工作区写草稿；自定义工具接收结果对象，自动保存工作稿副本并封存到固定结果路径。
          REVIEW_WORKSPACE_PATH: ${{ github.workspace }}/review-workspace
          REVIEW_RESULT_PATH: ${{ runner.temp }}/review-result.json
        with:
          # Agent 和 action 都只持有目标仓库的只读 installation token。
          github_token: ${{ steps.read-token.outputs.token }}
          # 模型服务商和模型名称；均来自中央仓库配置。
          provider: openai
          model: ${{ vars.REVIEW_AGENT_MODEL }}
          # OpenAI-compatible Azure gateway；不配置时模型会被发送到错误的默认端点。
          base_url: ${{ vars.REVIEW_AGENT_BASE_URL }}
          # 模型 API 凭证；不与 GitHub installation token 混用。
          token: ${{ secrets.REVIEW_AGENT_API_KEY }}
          # 控制 Agent 的推理强度，不改变可用工具或 GitHub 权限。
          thinking_level: ${{ env.REVIEW_THINKING_LEVEL }}
          # 长审查允许 compact；关键调查状态由工作稿持久化，不依赖早期上下文。
          auto_compaction: true
          # 允许用 JavaScript 编排现有工具，并在返回模型前筛选查询结果。
          enable_codemode: true
          # 不注册依赖中央仓库 context 的 shaftoe GitHub 工具。
          load_builtin_extensions: false
          # 只加载中央仓库随 checkout 提供的可信提交工具，不在 Review 关键路径安装外部扩展。
          extensions: |
            control/.github/pi-extensions/review-tools.ts
          # write/edit 仅用于 Review 工作区；GitHub 查询工具和 installation token 均只读。
          loaded_tools: |
            read
            write
            edit
            grep
            find
            ls
            bash
            set_review_scope
            submit_review
            codemode
          # 入口预载固定可信规则；compaction 后按入口从控制面恢复。
          prompt: ${{ steps.review-prompt.outputs.prompt }}

      # 工作稿可用于复核模型的调查过程；artifact 下载需要中央仓库权限且限期保留。
      - name: Upload review workspace
        id: review-workspace
        if: always() && hashFiles('review-workspace/**') != ''
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-draft-workspace-${{ inputs.repository_id }}-${{ inputs.pull_number }}-${{ inputs.trigger_source }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ github.workspace }}/review-workspace
          if-no-files-found: error
          retention-days: 7

      # 只把无凭证最终结果传给新的 runner；结果始终按不可信输入处理。
      - name: Upload review result
        id: review-result
        if: steps.pi-review.outcome == 'success'
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-result-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-result.json
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: review
    if: always() && needs.review.outputs.check_id != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Mint trusted publication token
        id: publication-token
        uses: actions/create-github-app-token@v3.2.0
        with:
          client-id: ${{ vars.AGENTIC_REVIEW_CLIENT_ID }}
          private-key: ${{ secrets.AGENTIC_REVIEW_APP_PRIVATE_KEY }}
          owner: ${{ needs.review.outputs.owner }}
          repositories: ${{ needs.review.outputs.name }}
          # GitHub GraphQL 的 resolveReviewThread/unresolveReviewThread 实际要求 contents: write。
          permission-contents: write
          permission-pull-requests: write
          permission-checks: write

      - name: Checkout trusted publisher
        id: publisher-checkout
        if: ${{ !cancelled() && needs.review.outputs.context_artifact_id != '' }}
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download review progress
        id: download-progress
        if: ${{ !cancelled() && needs.review.outputs.context_artifact_id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.review.outputs.workspace_artifact_id }}
          path: ${{ runner.temp }}/review-workspace

      - name: Download sealed review context
        id: download-context
        if: ${{ !cancelled() && needs.review.outputs.context_artifact_id != '' }}
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.review.outputs.context_artifact_id }}
          path: ${{ runner.temp }}/review-context

      - name: Set up Node.js for trusted publisher
        id: publisher-node
        if: ${{ !cancelled() && needs.review.outputs.context_artifact_id != '' }}
        uses: actions/setup-node@v7.0.0
        with:
          node-version: 24

      # 即使 Agent 失败，也保存由可信请求与有效进度组装的历史范围。
      - name: Assemble review workspace
        id: assemble-workspace
        if: ${{ !cancelled() && steps.publisher-checkout.outcome == 'success' && steps.publisher-node.outcome == 'success' && steps.download-progress.outcome == 'success' && steps.download-context.outcome == 'success' }}
        env:
          REPOSITORY: ${{ inputs.repository }}
          PULL_NUMBER: ${{ inputs.pull_number }}
          BASE_SHA: ${{ needs.review.outputs.base_sha }}
          HEAD_SHA: ${{ needs.review.outputs.head_sha }}
          REVIEW_INVENTORY_DIGEST: ${{ needs.review.outputs.inventory_digest }}
          REVIEW_COMPARISON_START: ${{ needs.review.outputs.comparison_start }}
          REVIEW_RUN_ID: ${{ github.run_id }}
          REVIEW_RUN_ATTEMPT: ${{ needs.review.outputs.run_attempt }}
          REVIEW_TRIGGER_SOURCE: ${{ inputs.trigger_source }}
          REVIEW_COMMENT_ID: ${{ inputs.comment_id }}
          REVIEW_COMMENT_BODY: ${{ inputs.comment_body }}
          REVIEW_COMMENT_ROOT_ID: ${{ inputs.comment_root_id }}
          REVIEW_CONTEXT_PATH: ${{ runner.temp }}/review-context/review-context.json
          REVIEW_PROGRESS_PATH: ${{ runner.temp }}/review-workspace/review-progress.json
          REVIEW_COVERAGE_PATH: ${{ runner.temp }}/review-workspace/review-coverage.json
        run: node scripts/prepare-review-publication.ts

      - name: Upload requested review workspace
        if: ${{ !cancelled() && steps.assemble-workspace.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-workspace-${{ inputs.repository_id }}-${{ inputs.pull_number }}-${{ inputs.trigger_source }}-${{ github.run_id }}-${{ needs.review.outputs.run_attempt }}
          path: ${{ runner.temp }}/review-workspace
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      # 新 runner 中才注入 write token；发布器检查结果、覆盖与 root comment，发布到可信请求的 head。
      - name: Download review result
        id: download-result
        if: ${{ !cancelled() && needs.review.outputs.pi_outcome == 'success' }}
        uses: actions/download-artifact@v8.0.1
        with:
          artifact-ids: ${{ needs.review.outputs.result_artifact_id }}
          path: ${{ runner.temp }}/review-result

      - name: Publish review
        id: publish-review
        if: ${{ !cancelled() && steps.assemble-workspace.outcome == 'success' && steps.download-result.outcome == 'success' && steps.publication-token.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ steps.publication-token.outputs.token }}
          REVIEW_INVENTORY_DIGEST: ${{ needs.review.outputs.inventory_digest }}
          REVIEW_BOT_LOGIN: ${{ steps.publication-token.outputs.app-slug }}[bot]
          REVIEW_RESULT_PATH: ${{ runner.temp }}/review-result/review-result.json
          REVIEW_COVERAGE_PATH: ${{ runner.temp }}/review-workspace/review-coverage.json
          REVIEW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REVIEW_WORKSPACE_URL: ${{ needs.review.outputs.workspace_url }}
          REVIEW_MODEL: openai/${{ vars.REVIEW_AGENT_MODEL }}
          REVIEW_DURATION_SECONDS: ${{ needs.review.outputs.duration_seconds }}
          REVIEW_INPUT_TOKENS: ${{ needs.review.outputs.input_tokens }}
          REVIEW_OUTPUT_TOKENS: ${{ needs.review.outputs.output_tokens }}
          REVIEW_COST: ${{ needs.review.outputs.cost }}
        run: node scripts/publish-review.ts

      - name: Upload publication report
        id: publication-report
        if: ${{ !cancelled() && (steps.publish-review.outcome == 'success' || steps.publish-review.outcome == 'failure') }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-publication-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/review-workspace/publication-report.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload trusted completion workspace
        id: completion-workspace
        if: ${{ !cancelled() && steps.publish-review.outcome == 'success' && steps.publication-report.outcome == 'success' }}
        uses: actions/upload-artifact@v7.0.1
        with:
          name: review-completed-workspace-${{ inputs.repository_id }}-${{ inputs.pull_number }}-${{ inputs.trigger_source }}-${{ github.run_id }}-${{ needs.review.outputs.run_attempt }}
          path: ${{ runner.temp }}/review-workspace
          if-no-files-found: error
          overwrite: true
          retention-days: 7

      - name: Complete Agentic Review check
        id: complete-check
        if: always()
        uses: actions/github-script@v9.0.0
        env:
          REPOSITORY: ${{ inputs.repository }}
          CHECK_ID: ${{ needs.review.outputs.check_id }}
          PI_REVIEW_OUTCOME: ${{ needs.review.outputs.pi_outcome }}
          PUBLISH_REVIEW_OUTCOME: ${{ steps.publish-review.outcome }}
          COMPLETION_WORKSPACE_OUTCOME: ${{ steps.completion-workspace.outcome }}
          PUBLISH_JOB_STATUS: ${{ job.status }}
        with:
          github-token: ${{ steps.publication-token.outputs.token }}
          script: |
            const [owner, repo] = process.env.REPOSITORY.split('/');
            const conclusion = process.env.PI_REVIEW_OUTCOME === 'cancelled' || process.env.PUBLISH_JOB_STATUS === 'cancelled'
              ? 'cancelled'
              : process.env.PUBLISH_JOB_STATUS === 'success' && process.env.PI_REVIEW_OUTCOME === 'success' && process.env.PUBLISH_REVIEW_OUTCOME === 'success' && process.env.COMPLETION_WORKSPACE_OUTCOME === 'success'
                ? 'success'
                : 'failure';
            await github.rest.checks.update({
              owner,
              repo,
              check_run_id: Number(process.env.CHECK_ID),
              status: 'completed',
              conclusion,
              completed_at: new Date().toISOString(),
              output: {
                title: conclusion === 'success'
                  ? 'Agentic Review 已完成'
                  : conclusion === 'cancelled'
                    ? 'Agentic Review 已取消'
                    : 'Agentic Review 执行失败',
                summary: conclusion === 'success'
                  ? '审查已完成。'
                  : conclusion === 'cancelled'
                    ? '该审查已取消，当前提交保持不可合并。'
                    : '审查或发布未全部完成；部分结果可能已经发布。失败明细见 Actions 运行摘要和 publication report，当前提交保持不可合并。',
              },
            });
